<!-- Dichiarazione del tipo di documento HTML5 -->
<!doctype html>
<!-- Elemento radice del documento con lingua impostata su italiano -->
<html lang="it">
<head>
  <!-- Impostazione della codifica dei caratteri standard UTF-8 -->
  <meta charset="utf-8">
  <!-- Titolo dell'applicazione visibile sulla scheda del browser -->
  <title>EmojiCorp</title>
  <!-- Percorso base fondamentale per il funzionamento del routing di Angular -->
  <base href="/">
  <!-- Configurazione del viewport per garantire un layout responsive su tutti i dispositivi -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <!-- Componente radice (root) di Angular in cui viene renderizzata l'intera applicazione -->
  <app-root></app-root>
</body>
</html>
