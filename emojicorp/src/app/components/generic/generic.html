<div class="container my-4">
  <div class="d-flex align-items-center mb-4">
    <h2 class="text-capitalize me-3">{{ categoryKey }}</h2>
    <span class="badge bg-primary fs-6">{{ itemsList.length }} Elementi</span>
  </div>

  <div class="row g-4">
    @for (item of itemsList; track item.name) {
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm border-0 emoji-card">
          <div class="card-body text-center d-flex flex-column justify-content-center">
            <div class="display-1 my-3 emoji-icon">{{ item.emoji }}</div>
            <h4 class="card-title fw-bold text-dark">{{ item.name }}</h4>
            @if (item.category) {
              <div class="mt-2">
                <span class="badge bg-secondary rounded-pill">{{ item.category }}</span>
              </div>
            }
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center my-5">
        <div class="alert alert-warning">Nessun elemento trovato per la categoria specificata.</div>
      </div>
    }
  </div>
</div>
